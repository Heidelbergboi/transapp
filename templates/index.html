<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <title>TransApp – Dritare.tv</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body      { background:#f8f9fa }
    .brand    { color:#c41e3a;font-weight:700 }
    #log      { white-space:pre-wrap;font-family:monospace }
    #bar      { transition:width .2s }
    #stat     { font-size:.8rem;color:#555 }
  </style>
</head>
<body class="py-5">
<div class="container">
  <h1 class="brand mb-4">TransApp</h1>

  <div class="card p-4 shadow-sm">
    <div class="mb-3"><input type="file" id="file" accept="video/mp4" class="form-control"></div>

    <div class="mb-3">
      <label class="form-label">Numri i pjesëve</label>
      <input  type="number" id="parts" class="form-control" min="2" value="5">
    </div>

    <button class="btn btn-danger w-100" onclick="upload()">Starto</button>
  </div>

  <div class="progress my-3" style="height:.8rem;display:none">
    <div id="bar" class="progress-bar bg-danger"></div>
  </div>
  <div id="stat" class="mb-2"></div>

  <pre id="log" class="mt-3"></pre>
</div>

<script>
/* ── small helpers ─────────────────────────────────────────────────── */
const log  = t => { const el=document.getElementById('log');
                    el.textContent+=t+"\n"; el.scrollTop=el.scrollHeight; };

const showBar = () => document.querySelector('.progress').style.display='block';
const setBar  = p  => document.getElementById('bar').style.width = p.toFixed(1)+'%';
const setStat = s  => document.getElementById('stat').textContent = s;
const MB      = n  => (n/1048576).toFixed(1)+' MB';

let pingId=0;
const pingStart = ()=> pingId=setInterval(()=>fetch('/ping'),15_000);
const pingStop  = ()=> clearInterval(pingId);

/* ── orchestrator ──────────────────────────────────────────────────── */
async function upload(){
  const file  = document.getElementById('file').files[0];
  const parts = +document.getElementById('parts').value || 5;
  if(!file){ alert('Zgjidhni një MP4'); return; }

  log('🚦 /sign…');
  const sign = await fetch('/sign',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({filename:file.name,size:file.size})
      }).then(r=>r.json());

  pingStart();
  try{
    if(sign.multipart) await doMultipart(file, sign);
    else               await doSinglePOST(file, sign);
  }finally{ pingStop(); }

  log('🚦 /start-job…');
  const j = await fetch('/start-job',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({s3_key:sign.s3_key,parts})
      }).then(r=>r.json());
  window.location = j.stream;
}

/* ── plain form-POST  (≤5 GB) ─────────────────────────────────────── */
async function doSinglePOST(file, sign){
  const fd=new FormData();
  Object.entries(sign.fields).forEach(([k,v])=>fd.append(k,v));
  fd.append('file',file);

  log(`⬆️ Uploading ${MB(file.size)}…`);
  showBar();

  await new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST',sign.url,true);
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){
        setBar(e.loaded/e.total*100);
        setStat(`${MB(e.loaded)} / ${MB(e.total)}`);
      }
    };
    xhr.onload = ()=> xhr.status===204 ? resolve():reject('S3 '+xhr.status);
    xhr.onerror=()=> reject('network/CORS');
    xhr.send(fd);
  });

  setBar(100); setStat(`${MB(file.size)} / ${MB(file.size)}`);
  log('✅ Upload complete');
}

/* ── multipart (>5 GB OR whatever threshold you set) ──────────────── */
async function doMultipart(file,{part_urls,complete_url,part_mb}){
  const partSize = part_mb*1048576;
  const totalParts=part_urls.length;
  const etags=Array(totalParts);
  const parallel=5;      // upload at most 5 parts at once
  let done=0, uploaded=0; showBar();

  log(`⬆️ Multipart ${totalParts} × ${part_mb} MB…`);
  const work=[...Array(totalParts).keys()];
  const put = async idx=>{
    const blob=file.slice(idx*partSize, Math.min((idx+1)*partSize,file.size));
    const r   = await fetch(part_urls[idx],{method:'PUT',body:blob});
    if(!r.ok) throw new Error('part '+(idx+1));
    etags[idx]={ETag:r.headers.get('ETag'),PartNumber:idx+1};
    uploaded += blob.size;
    setBar((++done)/totalParts*100);
    setStat(`${MB(uploaded)} / ${MB(file.size)}`);
    log(`   ✅ part ${idx+1}/${totalParts}`);
  };
  await Promise.all([...Array(Math.min(parallel,totalParts))].map(async()=>{
    while(work.length) await put(work.shift());
  }));

  /* complete */
  const body='<CompleteMultipartUpload>'+etags.map(e=>
      `<Part><ETag>${e.ETag}</ETag><PartNumber>${e.PartNumber}</PartNumber></Part>`).join('')
    +'</CompleteMultipartUpload>';

  const r = await fetch(complete_url,{method:'POST',headers:{'Content-Type':'application/xml'},body});
  if(!r.ok) throw new Error('complete failed');
  setBar(100); setStat(`${MB(file.size)} / ${MB(file.size)}`);
  log('✅ Upload complete');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
